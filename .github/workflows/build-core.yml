name: Build Core OS & ISO

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-packages:
    runs-on: ubuntu-latest
    container:
      image: alpine:3.20
      env:
        LOGNAME: root
        USER: root

    steps:
      - uses: actions/checkout@v3

      - name: Install Base Build Dependencies
        run: apk add --no-cache git make gcc musl-dev perl curl ca-certificates xz ncurses-dev ncurses-static

      - name: Setup KISS Package Manager
        run: |
          git clone https://github.com/kiss-community/kiss /kiss
          echo "PATH=/kiss:$PATH" >> $GITHUB_ENV
          echo "KISS_ROOT=/" >> $GITHUB_ENV
          echo "KISS_PATH=$PWD/repo" >> $GITHUB_ENV
          echo "KISS_PROMPT=0" >> $GITHUB_ENV
          echo "KISS_HASH=sha256" >> $GITHUB_ENV

      - name: Bootstrap QBE
        run: |
          kiss build qbe
          kiss install qbe

      - name: Bootstrap cproc
        run: |
          kiss build cproc
          kiss install cproc

      - name: Build musl & linux-headers (with GCC)
        run: |
          kiss build musl && kiss install musl
          kiss build linux-headers && kiss install linux-headers

      - name: Set CC to cproc for system packages
        run: echo "CC=cproc" >> $GITHUB_ENV

      - name: Build Core Utilities (sbase, ubase, sinit, daemontools-encore)
        run: |
          kiss build sbase && kiss install sbase
          kiss build ubase && kiss install ubase
          kiss build sinit && kiss install sinit
          kiss build daemontools-encore && kiss install daemontools-encore

      - name: Build User Environment (yash, vis, dvtm, abduco)
        run: |
          kiss build yash && kiss install yash
          kiss build vis && kiss install vis
          kiss build dvtm && kiss install dvtm
          kiss build abduco && kiss install abduco

      - name: Assemble RootFS
        run: |
          mkdir -p /mnt/rootfs/bin /mnt/rootfs/sbin /mnt/rootfs/dev /mnt/rootfs/proc /mnt/rootfs/sys /mnt/rootfs/tmp /mnt/rootfs/var /mnt/rootfs/etc /mnt/rootfs/usr/bin /mnt/rootfs/usr/sbin /mnt/rootfs/usr/lib /mnt/rootfs/lib

          # Since packages are installed directly to the Alpine container's root,
          # we need to copy them from the system directories to our initramfs root.
          # To avoid copying Alpine's base utilities, we explicitly copy what we built.

          # Core utilities (sbase, ubase, daemontools-encore, yash, vis, dvtm, abduco)
          cp -a /usr/bin/sinit /mnt/rootfs/usr/bin/ 2>/dev/null || true
          cp -a /usr/bin/yash /mnt/rootfs/usr/bin/ 2>/dev/null || true
          cp -a /usr/bin/vis /mnt/rootfs/usr/bin/ 2>/dev/null || true
          cp -a /usr/bin/dvtm /mnt/rootfs/usr/bin/ 2>/dev/null || true
          cp -a /usr/bin/abduco /mnt/rootfs/usr/bin/ 2>/dev/null || true

          # Copy all sbase and ubase binaries (they are usually in /usr/bin)
          # We'll rely on the tarballs created by kiss build to extract exactly what we need
          for pkg in musl sbase ubase sinit daemontools-encore yash vis dvtm abduco; do
            # Find the built tarball
            tarball=$(find ~/.cache/kiss/bin -name "$pkg-*.tar.gz" | head -n 1)
            if [ -n "$tarball" ]; then
              tar -xzf "$tarball" -C /mnt/rootfs/
            fi
          done

          # Minimal configuration
          echo '#!/usr/bin/yash' > /mnt/rootfs/bin/rc.init
          echo 'echo "sinit is init"' >> /mnt/rootfs/bin/rc.init
          echo 'exec /usr/bin/yash' >> /mnt/rootfs/bin/rc.init
          chmod +x /mnt/rootfs/bin/rc.init

          # Crucial symlinks for kernel boot
          ln -s /usr/bin/sinit /mnt/rootfs/init
          ln -s /usr/bin/yash /mnt/rootfs/bin/sh

      - name: Compile Monolithic Kernel & Generate ISO
        run: |
          apk add --no-cache syslinux xorriso mtools ncurses-dev flex bison elfutils-dev openssl-dev
          curl -sL https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.10.3.tar.xz | tar -xJ
          cd linux-6.10.3

          # Unset CC so kernel compilation uses GCC, not cproc
          unset CC

          make defconfig
          # Disable loadable modules & DRM for Kenosis
          sed -i 's/CONFIG_MODULES=y/# CONFIG_MODULES is not set/' .config
          sed -i 's/CONFIG_DRM=y/# CONFIG_DRM is not set/' .config
          make olddefconfig
          make -j$(nproc) bzImage

          # Setup ISO structure
          mkdir -p /iso/boot/syslinux
          cp arch/x86/boot/bzImage /iso/boot/vmlinuz

          # Initramfs
          cd /mnt/rootfs
          find . | cpio -o -H newc | gzip -9 > /iso/boot/initramfs.igz

          # Syslinux configuration
          echo "DEFAULT kenosis" > /iso/boot/syslinux/syslinux.cfg
          echo "LABEL kenosis" >> /iso/boot/syslinux/syslinux.cfg
          echo "  LINUX /boot/vmlinuz" >> /iso/boot/syslinux/syslinux.cfg
          echo "  INITRD /boot/initramfs.igz" >> /iso/boot/syslinux/syslinux.cfg
          echo "  APPEND root=/dev/ram0 console=ttyS0 quiet" >> /iso/boot/syslinux/syslinux.cfg

          cp /usr/share/syslinux/isolinux.bin /iso/boot/syslinux/
          cp /usr/share/syslinux/ldlinux.c32 /iso/boot/syslinux/

          xorriso -as mkisofs \
            -o $GITHUB_WORKSPACE/kenosis-base-x86_64.iso \
            -b boot/syslinux/isolinux.bin \
            -c boot/syslinux/boot.cat \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            /iso

          cd $GITHUB_WORKSPACE

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenosis-base-x86_64.iso
          path: kenosis-base-x86_64.iso

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: rolling
          name: Kenosis Linux - Rolling Release
          files: kenosis-base-x86_64.iso
          body: |
            Automated build of the Kenosis Linux operating system.
            - **Architecture:** x86_64
            - **Init:** sinit
            - **Shell:** yash

      - name: Automated Boot Test (QEMU)
        run: |
          apk add --no-cache qemu-system-x86_64 qemu-ui-curses expect

          cat << 'EOF' > test-boot.exp
          #!/usr/bin/expect -f
          set timeout 60
          spawn qemu-system-x86_64 -m 512M -cdrom kenosis-base-x86_64.iso -nographic -boot d -serial stdio
          expect {
              "sinit is init" {
                  puts "\nSUCCESS: Kernel booted and sinit took over PID 1"
                  exit 0
              }
              timeout {
                  puts "\nERROR: Boot timeout"
                  exit 1
              }
          }
          EOF
          chmod +x test-boot.exp
          ./test-boot.exp
