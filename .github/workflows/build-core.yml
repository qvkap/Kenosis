name: Build Core OS and ISO

on:
  push:
    branches: [ "main", "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container: alpine:3.20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apk add --no-cache git make gcc musl-dev perl curl ca-certificates xz rsync syslinux xorriso mtools ncurses-dev flex bison elfutils-dev openssl-dev qemu-system-x86_64 qemu-ui-curses expect

      - name: Setup KISS Package Manager
        run: |
          git clone -b 5.5.0 https://github.com/kiss-community/kiss /kiss
          echo "/kiss" >> $GITHUB_PATH
          echo "KISS_HASH=sha256" >> $GITHUB_ENV
          echo "KISS_ROOT=/" >> $GITHUB_ENV
          echo "KISS_PATH=$GITHUB_WORKSPACE/repo" >> $GITHUB_ENV
          echo "KISS_PROMPT=0" >> $GITHUB_ENV
          echo "LOGNAME=root" >> $GITHUB_ENV
          echo "USER=root" >> $GITHUB_ENV

      - name: Build Toolchain
        run: |
          kiss build qbe
          kiss install qbe

          kiss build cproc
          kiss install cproc

          kiss build musl
          kiss install musl

          kiss build linux-headers
          kiss install linux-headers

      - name: Build Userland Packages with cproc
        run: |
          export CC=cproc
          export PATH="/usr/bin:/usr/local/bin:$PATH"

          kiss build sbase
          kiss build ubase
          kiss build sinit
          kiss build daemontools-encore
          kiss build yash
          kiss build vis
          kiss build dvtm
          kiss build abduco

      - name: Assemble target rootfs
        run: |
          mkdir -p /mnt/rootfs
          export KISS_ROOT=/mnt/rootfs

          kiss install sbase
          kiss install ubase
          kiss install sinit
          kiss install daemontools-encore
          kiss install yash
          kiss install vis
          kiss install dvtm
          kiss install abduco

          # Initialize standard layout inside rootfs
          mkdir -p /mnt/rootfs/bin /mnt/rootfs/etc /mnt/rootfs/dev /mnt/rootfs/sys /mnt/rootfs/proc /mnt/rootfs/tmp /mnt/rootfs/var

          # Setup sinit specific files
          ln -s /usr/bin/sinit /mnt/rootfs/init

          cat << 'RCINIT' > /mnt/rootfs/bin/rc.init
          #!/bin/sh
          export PATH=/bin:/usr/bin:/usr/local/bin
          mount -t proc proc /proc
          mount -t sysfs sys /sys
          mount -t devtmpfs dev /dev
          echo "Starting Kenosis shell..."
          exec yash
          RCINIT
          chmod +x /mnt/rootfs/bin/rc.init

          cat << 'RCSHUTDOWN' > /mnt/rootfs/bin/rc.shutdown
          #!/bin/sh
          echo "Shutting down..."
          RCSHUTDOWN
          chmod +x /mnt/rootfs/bin/rc.shutdown

      - name: Compile Kernel and Generate ISO
        run: |
          chmod +x ./build_iso.sh
          ./build_iso.sh

      - name: Test ISO in QEMU
        run: |
          cat << 'EXPECT_SCRIPT' > test_boot.exp
          #!/usr/bin/expect -f
          set timeout 60
          spawn qemu-system-x86_64 -m 512M -cdrom kenosis-base-x86_64.iso -nographic -no-reboot

          expect {
            "Starting Kenosis shell" {
              puts "SUCCESS: rc.init ran!"
            }
            timeout {
              puts "ERROR: Boot timeout!"
              exec bash -c "exit 1"
            }
          }

          send "echo IT_WORKS\r"
          expect {
            "IT_WORKS" {
              puts "SUCCESS: Yash shell is interactive!"
            }
            timeout {
              puts "ERROR: Yash shell did not respond!"
              exec bash -c "exit 1"
            }
          }
          EXPECT_SCRIPT
          chmod +x test_boot.exp
          ./test_boot.exp

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kenosis-base-x86_64.iso
          path: kenosis-base-x86_64.iso
